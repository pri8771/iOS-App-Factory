name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript workspace
        run: pnpm verify

      - name: Verify Swift fixture baseline
        run: swift test --package-path fixtures/swift-greeter
